# PR ごと（develop / staging / master 向け）と、各ブランチへの push で
# 型チェック → Lint → Jest → 本番ビルド → E2E（Playwright）を実行する。
# E2E のケースは docs/test-cases.md と 1 対 1 で対応している（テスト名の先頭がケース ID）。
#
# Strapi・Notion・SES の値は CI に入れない。CMS 未接続でもトップはフォールバック文言で描画され、
# お問い合わせの E2E は「送信する」を押さないため、どれも未設定のままビルドと E2E が通る。
name: CI

on:
  pull_request:
    branches: [develop, staging, master]
  push:
    branches: [develop, staging, master]

# 同じ PR / ブランチで新しい push があれば、走っている古い実行は止める
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck / Lint / Jest / Build / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      # Next.js の匿名テレメトリを送らない
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Unit tests (Jest)
        run: yarn test:ci

      - name: Build
        run: yarn build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: yarn e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
